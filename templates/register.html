{% extends 'base.html' %}{% block title %}Sign up{% endblock %}{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-symbol">S<span>•</span></div><p class="eyebrow">GET INVOLVED</p><h1>Join the community</h1><p class="muted">Create a free account to connect with campus clubs.</p><form action="{{ url_for('register') }}" method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="name">Full name</label><input id="name" name="full_name" placeholder="Your full name" maxlength="100" autocomplete="name" required value="{{ request.form.get('full_name','') }}"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@university.edu" maxlength="254" autocomplete="email" required value="{{ request.form.get('email','') }}"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required><p class="field-hint">Use at least 8 characters. For a real deployment, use a strong, unique password.</p><button class="btn btn-primary btn-full" type="submit">Create my account →</button></form><p class="auth-bottom">Already a member? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
