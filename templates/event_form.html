{% extends 'base.html' %}{% block title %}{{ 'Edit event' if event else 'Create event' }}{% endblock %}{% block content %}
<section class="page-intro"><div class="container"><a class="back-link" href="{{ url_for('club_detail', club_id=club.id) }}">← {{ club.name }}</a><p class="eyebrow">CLUB LEADER TOOLS</p><h1>{{ 'Edit event' if event else 'Create a new event' }}</h1><p>Give students the details they need to join your activity.</p></div></section><section class="section page-section"><div class="container"><div class="card form-panel"><form method="post" class="form" action="{{ url_for('event_edit', event_id=event.id) if event else url_for('event_new', club_id=club.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="title">Event title</label><input id="title" name="title" maxlength="120" minlength="3" placeholder="e.g. Networking Night" value="{{ request.form.get('title', event.title if event else '') }}" required><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="1500" minlength="5" placeholder="What should participants expect?" required>{{ request.form.get('description', event.description if event else '') }}</textarea><label for="location">Location</label><input id="location" name="location" maxlength="120" placeholder="e.g. Student Center" value="{{ request.form.get('location', event.location if event else '') }}" required><div class="form-grid"><div><label for="start_at">Date and time</label><input id="start_at" type="datetime-local" name="start_at" value="{{ request.form.get('start_at', event.start_at if event else '') }}" required></div><div><label for="capacity">Maximum participants</label><input id="capacity" name="capacity" type="number" min="1" max="10000" value="{{ request.form.get('capacity', event.capacity if event else '40') }}" required></div></div><button class="btn btn-primary" type="submit">{{ 'Save changes' if event else 'Publish event' }} →</button></form></div></div></section>
{% endblock %}
