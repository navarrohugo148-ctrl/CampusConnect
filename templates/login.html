{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-symbol">S<span>•</span></div><p class="eyebrow">WELCOME BACK</p><h1>Log in to Seahawks Connect</h1><p class="muted">Your clubs and events are waiting for you.</p>
<form action="{{ url_for('login') }}" method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@university.edu" maxlength="254" autocomplete="email" required value="{{ request.form.get('email', '') }}"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="btn btn-primary btn-full" type="submit">Log in →</button></form><p class="auth-bottom">New to Seahawks Connect? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
